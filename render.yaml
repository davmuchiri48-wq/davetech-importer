services:
  - type: web
    name: davetech-importer
    runtime: node
    plan: free            # use "starter" or higher for reliable scheduled sync (free instances sleep)
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: ALIEXPRESS_APP_KEY
        sync: false
      - key: ALIEXPRESS_APP_SECRET
        sync: false
      - key: ALIEXPRESS_SHIP_TO
        value: KE
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
